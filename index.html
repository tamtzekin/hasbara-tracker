<!DOCTYPE html>
<html lang="en">
    <style>
        body {
            background-color: #01a824;
        }
    </style>
<head>
    <link rel="stylesheet" type="text/css" href="../hasbara-tracker/assets/css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        table {
            width: 80%;
            margin: 50px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black; /* Column lines black */
            padding: 12px;
            text-align: left;
        }

        tr {
            border: 1px solid transparent; /* Row lines transparent */
        }

        tr:hover {
            background-color: #FFDAB9; /* Pale Salmon Pink */
        }
    </style>
    <title>Hover Highlight Table</title>
</head>
<h1>Hasbara Tracker<br>
    <span class="dots"></span>
</h1>

<body>
A database of Israeli state fabrications and unsubstantianted claims since 7 Oct 2023 and the ongoing genocide in Gaza.  
<br>
<br>

<!-- Filter buttons -->
<button onclick="filterItems('all')">All</button>
<button onclick="filterItems('category1')">Oct 7</button>
<button onclick="filterItems('category2')">Death</button>
<!-- <button onclick="filterItems('category3')">Category 3</button> -->

<!-- Items to filter -->
<div class="filtered-item category1"><a href="">Claim: Forty beheaded babies</a></div>
<div class="filtered-item category2"><a href="">Claim: Forty beheaded babies</a></div>
<!-- <div class="filtered-item category3">Item 3 (Category 3)</div> -->
<!-- <div class="filtered-item category1">Item 4 (Category 1)</div> -->
<!-- <div class="filtered-item category2">Item 5 (Category 2)</div> -->
<!-- <div class="filtered-item category3">Item 6 (Category 3)</div> -->

<script>
    function filterItems(category) {
        // Get all items
        var items = document.querySelectorAll('.filtered-item');

        // Hide all items
        items.forEach(function(item) {
            item.style.display = 'none';
        });

        // If the category is 'all', show all items
        if (category === 'all') {
            items.forEach(function(item) {
                item.style.display = 'block';
            });
        } else {
            // Show only items with the selected category
            var selectedItems = document.querySelectorAll('.' + category);
            selectedItems.forEach(function(item) {
                item.style.display = 'block';
            });
        }

        // Remove the 'active' class from all buttons
        document.querySelectorAll('button').forEach(function(button) {
            button.classList.remove('active');
        });

        // Add the 'active' class to the clicked button
        event.target.classList.add('active');
    }
</script>
</body>
</html>
